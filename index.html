.card{width:min(900px,96vw);padding:30px 22px 35px;border-radius:30px;
 background:rgba(20,10,25,.58);backdrop-filter:blur(7px);
 box-shadow:0 15px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35)}
h1{font-size:clamp(32px,7vw,64px);margin:5px 0 8px}
.subtitle{font-size:clamp(18px,3.5vw,30px);font-weight:800;margin-bottom:25px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{padding:18px 7px;border-radius:20px;background:rgba(255,255,255,.17)}
.num{display:block;font-size:clamp(32px,7vw,60px);font-weight:900}
.label{font-size:12px;letter-spacing:2px;text-transform:uppercase}
.joke{margin-top:24px;font-size:clamp(16px,2.6vw,22px);font-weight:700}
.small{margin-top:10px;opacity:.8;font-size:14px}

</style>
</head>
<body>
<main class="card">
<div style="font-size:clamp(45px,9vw,80px)">🎉🎂🥳</div>
<h1>Lene wird 18!</h1>
<div class="subtitle" id="headline">bis zur Lene ihrem 18. Geburtstag</div>
<div class="timer">
<div class="box"><span class="num" id="days">--</span><span class="label">Tage</span></div>
<div class="box"><span class="num" id="hours">--</span><span class="label">Stunden</span></div>
<div class="box"><span class="num" id="minutes">--</span><span class="label">Minuten</span></div>
<div class="box"><span class="num" id="seconds">--</span><span class="label">Sekunden</span></div>
</div>
<div class="joke" id="joke">🍾 Noch schnell erwachsen werden, bevor es zu spät ist!</div>
<div class="small">26.09.2027 • Level 18 wird freigeschaltet 🔓</div>
</main>
<script>
"use strict";
const target = new Date("2027-09-26T00:00:00");
const $ = id => document.getElementById(id);
const jokes = [
"🍾 Noch schnell erwachsen werden, bevor es zu spät ist!",
"🚨 Achtung: Volljährigkeit nähert sich mit Lichtgeschwindigkeit!",
"💸 Ab 18 darf man mehr – leider auch mehr Verantwortung.",
"🧓 Herzlichen Glückwunsch, du bist dann offiziell alt.",
"🎮 Level 18 wird freigeschaltet. Viel Glück beim Bossfight!",
"🥳 Fast erwachsen. Betonung auf FAST.",
"🚗 18! Jetzt wird's langsam gefährlich auf der Straße."
];
let jokeIndex=0;

function updateCountdown(){
  const diff = target.getTime() - Date.now();
  if(diff <= 0){
    $("headline").textContent="🎉 SIE IST 18! ALLES GUTE, LENE! 🎉";
    $("days").textContent="0"; $("hours").textContent="00";
    $("minutes").textContent="00"; $("seconds").textContent="00";
    $("joke").textContent="🍾 Endlich 18 – jetzt kann der Wahnsinn offiziell beginnen!";
    return;
  }
  const total=Math.floor(diff/1000);
  $("days").textContent=Math.floor(total/86400);
  $("hours").textContent=String(Math.floor((total%86400)/3600)).padStart(2,"0");
  $("minutes").textContent=String(Math.floor((total%3600)/60)).padStart(2,"0");
  $("seconds").textContent=String(total%60).padStart(2,"0");
}
updateCountdown();
setInterval(updateCountdown,1000);
setInterval(()=>{jokeIndex=(jokeIndex+1)%jokes.length;$("joke").textContent=jokes[jokeIndex]},5000);
</script>
</body>
</html>
